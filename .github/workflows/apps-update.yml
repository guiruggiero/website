name: Apps update

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      app:
        description: App to update, such as pdfcraft (default is all of them, and required with a version)
        type: string
      version:
        description: Release tag to install, such as v0.20.0 to roll back (default is the latest)
        type: string
      force:
        description: Upload the latest release again even if the bucket has it
        type: boolean
        default: false
  schedule:
    - cron: "24 8 * * 6" # Saturdays, 08:24 UTC (off the hour, when GitHub's queue is busiest)

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update-apps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: apps
        run: npm ci --ignore-scripts

      - name: Update each app from its latest release
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_STORAGE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
          APP: ${{ inputs.app }}
          FORCE: ${{ inputs.force }}
          VERSION: ${{ inputs.version }}
          EVENT: ${{ github.event_name }}
        run: |
          flags=""
          if [ -n "$APP" ]; then flags="$flags $APP"; fi
          if [ "$FORCE" = "true" ]; then flags="$flags --force"; fi
          if [ -n "$VERSION" ]; then flags="$flags --version $VERSION"; fi

          # Scheduled runs skip releases from the last 2 days
          if [ "$EVENT" = "schedule" ]; then flags="$flags --min-age-days 2"; fi

          node apps/update.js $flags
