name: Apps update

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to install, such as v0.20.0 to roll back (default is the latest)
        type: string
      force:
        description: Upload the latest release again even if the bucket has it
        type: boolean
        default: false
  schedule:
    - cron: "0 8 * * 6" # Saturdays, 08:00 UTC (00:00 PT, like Dependabot)

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update-apps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          for dir in apps/*/; do
            (cd "$dir" && npm ci) || exit 1
          done

      - name: Update each app from its latest release
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_STORAGE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
          VERSION: ${{ inputs.version }}
          EVENT: ${{ github.event_name }}
        run: |
          flags=""
          if [ "$FORCE" = "true" ]; then flags="$flags --force"; fi
          if [ -n "$VERSION" ]; then flags="$flags --version $VERSION"; fi

          # Scheduled runs skip releases from the last 2 days, to let hotfixes land first
          if [ "$EVENT" = "schedule" ]; then flags="$flags --min-age-days 2"; fi

          # One failing app doesn't stop the others
          failed=0
          for dir in apps/*/; do
            node apps/update.js "$(basename "$dir")" $flags || failed=1
          done
          exit $failed
