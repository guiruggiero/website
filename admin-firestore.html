<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">

        <!-- Preconnects and preloads -->
        <link rel="preload" href="images/gr-logo-light.webp" as="image">
        <link rel="preload" href="images/gr-logo-dark.webp" as="image">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="preload" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" as="style">
        <link rel="preconnect" href="https://cdn.jsdelivr.net">
        <link rel="preconnect" href="https://www.gstatic.com">
        <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>

        <!-- Browser tags -->
        <title>Chat logs - Gui Ruggiero</title>
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="color-scheme" content="dark light">

        <!-- Favicons - inline instead of shared-head -->
        <link rel="icon" type="image/x-icon" href="images/favicons/favicon-light.ico" media="(prefers-color-scheme: dark)">
        <link rel="icon" type="image/png" sizes="32x32" href="images/favicons/favicon-32x32-light.png" media="(prefers-color-scheme: dark)">
        <link rel="icon" type="image/x-icon" href="images/favicons/favicon-dark.ico" media="(prefers-color-scheme: light)">
        <link rel="icon" type="image/png" sizes="32x32" href="images/favicons/favicon-32x32-dark.png" media="(prefers-color-scheme: light)">

        <!-- Critical scripts -->
        <script>
            // Import scripts dynamically
            function loadScript(baseName, {type = "module", crossorigin, target = "head"} = {}) {
                const script = document.createElement("script");
                const isDev = globalThis.location.href.includes("ngrok");
                script.src = isDev ? `modules/${baseName}.js` : `modules/${baseName}.min.js`;
                script.type = type;
                script.async = false; // Restore execution order (default is async)
                if (crossorigin) script.crossorigin = crossorigin;
                (target === "body" ? document.body : document.head).appendChild(script);
            }
            loadScript("sentry", {type: "text/javascript"});
            loadScript("theme-toggle");
        </script>
        <script src="https://js.sentry-cdn.com/08c1d6850ae372049a97cdeae4a933fc.min.js" crossorigin="anonymous" data-lazy="no"></script>

        <!-- Stylesheets -->
        <link rel="stylesheet" href="styles/admin.css">
        <script src="https://cdn.jsdelivr.net/npm/iconify-icon/dist/iconify-icon.min.js"></script>

        <!-- Search engine tag -->
        <meta name="robots" content="noindex, nofollow">
    </head>

    <body>
        <header>
            <div class="header-container">
                <div class="logo-theme-toggle">
                    <a href="https://guiruggiero.com/" aria-label="Gui Ruggiero homepage">
                        <picture>
                            <source srcset="images/gr-logo-light.webp" type="image/webp">
                            <img src="images/gr-logo-light.png" alt="Gui Ruggiero logo" width="28.43" height="34">
                        </picture>
                    </a>

                    <button id="theme-toggle" aria-label="Switch to light theme"><iconify-icon icon="ph:sun-bold"></iconify-icon></button>
                </div>

                <!-- Social links would go here on a public page -->
                <div class="header-actions">
                    <a href="https://console.firebase.google.com/u/0/project/guiruggiero/firestore/databases/-default-/data/~2Fv1" target="_blank" class="external-link">
                        Firebase Console
                        <iconify-icon icon="ph:arrow-square-out-bold"></iconify-icon>
                    </a>

                    <button id="sign-out" class="text-button" type="button" hidden>Sign out</button>
                </div>
            </div>
        </header>

        <main>
            <!-- Second gate, on top of Cloudflare Zero Trust -->
            <section id="auth-overlay">
                <button id="sign-in" class="primary-button" type="button">Sign in with Google</button>
                <p id="auth-error" class="auth-error"></p>
            </section>

            <section id="admin-content" hidden>
                <nav class="admin-nav">
                    <a href="admin.html">Service health</a>
                    <a href="admin-firestore.html" class="admin-nav-current" aria-current="page">Chat logs</a>
                </nav>

                <div class="filters">
                    <div class="filter-field">
                        <label for="collection-picker">Collection</label>
                        <select id="collection-picker">
                            <option value="v1">v1 (production)</option>
                            <option value="dev">dev (ngrok)</option>
                        </select>
                    </div>

                    <div class="filter-field">
                        <label for="start-date">From</label>
                        <input id="start-date" type="date">
                    </div>

                    <div class="filter-field">
                        <label for="end-date">To</label>
                        <input id="end-date" type="date">
                    </div>

                    <!-- Quick ranges, counted back from today -->
                    <div class="range-presets" role="group" aria-label="Quick date ranges">
                        <button type="button" class="preset-button" data-days="7" aria-pressed="false">7d</button>
                        <button type="button" class="preset-button" data-days="30" aria-pressed="false">30d</button>
                        <button type="button" class="preset-button" data-days="90" aria-pressed="false">90d</button>
                    </div>

                    <button id="load-chats" class="primary-button" type="button">Load</button>
                </div>

                <div class="results-bar">
                    <p id="chat-status" class="chat-status" aria-live="polite"></p>
                    <button id="toggle-all" class="text-button" type="button" hidden>Expand all</button>
                </div>

                <div id="chat-list"></div>
            </section>
        </main>

        <footer>
            Built with lots of ☕ by Gui Ruggiero himself
        </footer>

        <!-- Other script -->
        <script>
            loadScript("admin-firestore", {crossorigin: "anonymous", target: "body"});
        </script>
    </body>
</html>
